name: build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig 0.17.0 (PyPI build)
        run: python -m pip install ziglang==0.17.0

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then v="0.0.0-beta.${GITHUB_SHA::7}"
          else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          [[ "$GITHUB_REF" == refs/heads/beta ]] && export FOLLOW_MENU=1
          ZIG="python -m ziglang" VERSION="${{ steps.ver.outputs.version }}" bash build.sh package

      - name: Test the Linux installer against a fake Steam library
        run: |
          set -euo pipefail
          unzip -q dist/*.zip -d pkg && P=$(echo pkg/*)
          H=$RUNNER_TEMP/home; S=$H/.local/share/Steam/steamapps
          G="$S/common/Tomb Raider IV-VI Remastered"
          mkdir -p "$G" "$S/compatdata/2525380/pfx"
          printf '"libraryfolders"\n{\n\t"0"\n\t{\n\t\t"path"\t\t"%s"\n\t}\n}\n' "$H/.local/share/Steam" > "$S/libraryfolders.vdf"
          printf '"AppState"\n{\n\t"installdir"\t\t"Tomb Raider IV-VI Remastered"\n}\n' > "$S/appmanifest_2525380.acf"
          echo stub > "$G/tomb456.exe"
          printf 'WINE REGISTRY Version 2\n' > "$S/compatdata/2525380/pfx/user.reg"
          HOME=$H "$P/install.sh" --defaults
          test -f "$G/xinput1_3.dll"
          grep -q 'AppDefaults\\\\tomb456.exe\\\\DllOverrides' "$S/compatdata/2525380/pfx/user.reg"
          HOME=$H "$P/install.sh" --uninstall
          test ! -f "$G/xinput1_3.dll" && ! grep -q AppDefaults "$S/compatdata/2525380/pfx/user.reg"

      - uses: actions/upload-artifact@v4
        with:
          name: TRRHybridControls-v${{ steps.ver.outputs.version }}
          path: dist/*.zip

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TRRHybridControls-v${{ needs.build.outputs.version }}

      - name: Test the Windows installer against a fake game folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive (Get-Item *.zip).FullName -DestinationPath pkg
          $p = (Get-ChildItem pkg -Directory)[0].FullName
          $game = Join-Path $env:RUNNER_TEMP "Tomb Raider IV-VI Remastered"
          New-Item -ItemType Directory -Force $game | Out-Null
          Set-Content (Join-Path $game "tomb456.exe") "stub"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$p\install.ps1" -Defaults -GameDir $game
          if (-not (Test-Path "$game\xinput1_3.dll")) { throw "DLL not installed" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$p\install.ps1" -Uninstall -GameDir $game
          if (Test-Path "$game\xinput1_3.dll") { throw "DLL not removed" }

      - name: Load the DLL on Windows (64-bit) and check it stays inactive outside the game
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $p = (Get-ChildItem pkg -Directory)[0].FullName
          $dll = "$p\files\xinput1_3.dll"
          Add-Type -Name K -Namespace W -MemberDefinition '[DllImport("kernel32", CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibrary(string p);'
          $h = [W.K]::LoadLibrary($dll)
          if ($h -eq [IntPtr]::Zero) { throw "LoadLibrary failed" }
          $log = Get-Content "$p\files\TRRHybridControls.log" -Raw
          Write-Host $log
          if ($log -notmatch "TRR Hybrid Controls") { throw "no startup line in the log" }
          if ($log -notmatch "inactive") { throw "mod did not stay inactive in a foreign process" }

  release:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TRRHybridControls-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "TRR Hybrid Controls $GITHUB_REF_NAME" \
            --notes-file docs/INSTALL.txt \
            $([[ "$VERSION" == 0.* ]] && echo --prerelease)

  beta:
    needs: [build, windows]
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TRRHybridControls-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the rolling beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta dist/*.zip --prerelease --target "$GITHUB_SHA" \
            --title "TRR Hybrid Controls beta ($VERSION)" \
            --notes "Beta from the beta branch ($GITHUB_SHA): the buttons follow the Control Type of the game menu. Replaced on every push to beta. Install as described in the zip's README.txt."
